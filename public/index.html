b}.comment-item p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65}.comment-form{display:grid;gap:8px;margin-top:12px}.comment-form input,.comment-form textarea{width:100%;border:1px solid #ead7e1;border-radius:10px;padding:10px;background:#fffafd}.comment-form textarea{min-height:76px;resize:vertical}.comment-help{font-size:11px;color:#9b8491;margin:8px 0 0}.comment-submit{justify-self:start;border:0;border-radius:10px;padding:10px 13px;background:#d94f8b;color:white;font-weight:650}.comment-submit:disabled{opacity:.6}[hidden]{display:none!important}@media(max-width:500px){.wrap{padding:12px 11px 30px}.hero{padding:22px 18px;border-radius:22px}.pill{font-size:10px}.compose,.post{padding:15px}.actions{justify-content:space-between;gap:6px}.hero h2{margin-top:22px}}

html{scroll-behavior:smooth;scroll-padding-top:16px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a84277;outline-offset:2px}.cta,.submit,.refresh,.tab,.action{min-height:40px}.tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap;padding:2px 1px 7px;scrollbar-width:thin}.tab{flex:0 0 auto}.brand{min-width:0}.brand small{display:block;letter-spacing:1px;line-height:1.5}.pill{white-space:nowrap}.status{flex-shrink:0}.compose{scroll-margin-top:12px}@media(max-width:500px){.top{gap:8px;flex-wrap:wrap}.brand{flex:1 1 calc(100% - 64px)}.lang-switch{order:3;max-width:130px}.pill{margin-left:0;order:4}.hero h2{font-size:29px;letter-spacing:-.5px}.hero p{font-size:14px;line-height:1.7}.cta{width:100%;min-height:46px}.section{align-items:center}.section h2{font-size:21px}.tools{align-items:flex-start}.tabs{width:100%;order:1}.status{order:2}.actions{gap:12px}.action{min-height:42px}.row{align-items:flex-start;flex-direction:column}.row>div{width:100%;display:flex;gap:8px}.row button{flex:1}.compose input,.compose select,.compose textarea{font-size:16px}}

<body><div class="wrap">
<header class="hero"><div class="top"><div class="logo">✦</div><div class="brand"><h1>Tenby 校园圈</h1><small>TENBY CAMPUS COMMUNITY · 分享真实校园生活</small></div><span class="pill">学生交流社区</span><select id="languageSwitch" class="lang-switch" aria-label="Language"><option value="zh-CN">中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select></div><h2>校园生活的每一面，<br><em>都值得分享。</em></h2><p>聊日常、问问题、分享兴趣，也可以只是记录今天。</p><button class="cta" id="openForm">＋ 发布一条动态</button></header>
<div class="section"><div><small id="schoolLabel">YOUR CAMPUS</small><h2>大家都在分享</h2></div><button class="refresh" id="refresh">↻ 刷新</button></div>
<div class="tools"><div class="tabs" id="tabs"></div><select id="sortOrder" class="lang-switch" aria-label="排序"><option value="newest">最新</option><option value="popular">最热门</option></select><span class="status" id="status">正在连接数据库…</span></div>
<div class="notice" id="notice" hidden role="status"></div>
<form class="compose" id="compose" hidden><h3>✍️ 发布一条动态</h3><label>选择话题<select id="category"><option value="日常分享">日常分享</option><option value="校园生活">校园生活</option><option value="学习交流">学习交流</option><option value="求助互助">求助互助</option><option value="吐槽建议">吐槽建议</option><option value="兴趣交友">兴趣交友</option><option value="其他话题">其他话题</option></select></label><label>匿名昵称<input id="nickname" maxlength="24" value="匿名同学" placeholder="例如：晚风"></label><label>想分享的内容<textarea id="content" maxlength="1000" minlength="3" required placeholder="今天发生了什么？有什么经验、问题或想法想分享？请勿发布他人隐私、学号、联系方式或未经同意的照片。"></textarea></label><div class="row"><span id="count">0/1000 · 发布后需审核</span><div><button type="button" class="refresh" id="cancel">取消</button> <button class="submit" id="send" type="submit">提交投稿</button></div></div></form>
<div id="feed"></div><footer class="footer">✦ <strong>校园圈</strong> · 分享校园生活，连接每一个你<br>尊重不同观点，友善交流；请勿发布他人隐私、骚扰或违法内容。<br>新动态经基础审核后公开展示。</footer>
</div>
<script type="module">
const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2').catch(error => {
 const status=document.querySelector('#status'), notice=document.querySelector('#notice');
 if(status)status.textContent='数据库客户端加载失败';
 if(notice){notice.textContent='无法加载数据库组件。请检查网络连接，或稍后刷新页面。';notice.hidden=false;}
 console.error('Supabase client module failed to load:',error);
 throw error;
});
// CONFIG: Publishable key is intended for browser use. Never put a service_role/secret key here.
const SUPABASE_URL = 'https://ttdzyotdtwpsuqideprq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_jPZubrHoG5XHihwAwnpfNg_3MOG_iAL';
const SCHOOL_NAME = 'Tenby';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
document.querySelector('#schoolLabel').textContent = SCHOOL_NAME;
const categories=['全部','日常分享','校园生活','学习交流','求助互助','吐槽建议','兴趣交友','其他话题'];
const icons={'日常分享':'☀️','校园生活':'🏫','学习交流':'📚','求助互助':'🤝','吐槽建议':'💬','兴趣交友':'🎨','其他话题':'✦'};
let active='全部',sortOrder='newest',posts=[],liked=new Set(JSON.parse(localStorage.getItem('campus-liked')||'[]'));
const $=s=>document.querySelector(s);
function notice(msg){$('#notice').textContent=msg;$('#notice').hidden=!msg}
function ago(d){const m=Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/60000));return m<1?'刚刚':m<60?m+'分钟前':m<1440?Math.floor(m/60)+'小时前':Math.floor(m/1440)+'天前'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawTabs(){$('#tabs').innerHTML=categories.map(c=>'<button class="tab '+(active===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawTabs();drawPosts()})}
function drawPosts(){const shown=posts.filter(p=>active==='全部'||p.category===active).sort((a,b)=>sortOrder==='popular'?(Number(b.likes_count)||0)-(Number(a.likes_count)||0):new Date(b.created_at)-new Date(a.created_at));$('#feed').innerHTML=shown.length?shown.map(p=>'<article class="post"><div class="post-head"><div class="avatar">'+(icons[p.category]||'💌')+'</div><div class="author"><strong>'+escapeHtml(p.nickname||'匿名同学')+'</strong><small>'+ago(p.created_at)+'</small></div><span class="cat">'+escapeHtml(p.category)+'</span></div><p class="content">'+escapeHtml(p.content)+'</p><div class="actions"><button class="action '+(liked.has(p.id)?'liked':'')+'" data-like="'+p.id+'">♡ '+(Number(p.likes_count)||0)+' 赞</button><button class="action" data-report="'+p.id+'">⚑ 举报</button><button class="action" data-comments="'+p.id+'">评论</button></div><div class="comments" data-comments-panel="'+p.id+'" hidden></div></article>').join(''):'<div class="empty"><div style="font-size:30px">💌</div><strong>这里还没有内容</strong>来分享第一条动态吧。</div>';
$('#feed').querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>like(b.dataset.like));$('#feed').querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report));$('#feed').querySelectorAll('[data-comments]').forEach(b=>b.onclick=()=>toggleComments(b.dataset.comments))}
async function load(){
 $('#status').textContent='正在连接…';$('#status').className='status';notice('');
 try{
  const result=await Promise.race([
   supabase.from('posts').select('id,category,nickname,content,created_at,likes_count').eq('status','approved').order('created_at',{ascending:false}).limit(100),
   new Promise((_,reject)=>setTimeout(()=>reject(new Error('数据库请求超过 12 秒仍未响应，请检查网络或 Supabase API。')),12000))
  ]);
  if(result.error)throw result.error;
  $('#status').textContent='● 已连接';$('#status').className='status ok';posts=result.data||[];notice('');
 }catch(error){
  $('#status').textContent='数据库连接失败';$('#status').className='status';
  notice('连接失败：'+(error?.message||'未知错误'));
  console.error('Supabase load failed:',error);
 }finally{drawPosts()}
}
async function toggleComments(id){
 const panel=document.querySelector('[data-comments-panel="'+id+'"]');
 if(!panel)return;
 panel.hidden=!panel.hidden;
 if(panel.hidden)return;
 panel.innerHTML='<div class="comments-title">评论</div><div class="comment-list">加载评论中…</div><form class="comment-form" data-comment-form="'+id+'"><input name="nickname" maxlength="24" placeholder="评论昵称（选填）" aria-label="评论昵称"><textarea name="content" maxlength="500" required placeholder="写下你的评论…"></textarea><button class="comment-submit" type="submit">发布评论</button></form><p class="comment-help">评论需审核后显示。</p>';
 const list=panel.querySelector('.comment-list');
 const {data,error}=await supabase.from('comments').select('id,nickname,content,created_at').eq('post_id',id).eq('status','approved').order('created_at',{ascending:true}).limit(100);
 if(error){list.textContent='加载评论失败，请稍后重试。';console.error('Comments load failed:',error);return}
 list.innerHTML=data.length?data.map(c=>'<div class="comment-item" data-user-content><strong>'+escapeHtml(c.nickname||'匿名同学')+'</strong><p>'+escapeHtml(c.content)+'</p></div>').join(''):'<p class="comment-help">暂无评论，来发表第一条吧。</p>';
 panel.querySelector('form').onsubmit=async e=>{
  e.preventDefault();
  const form=e.currentTarget,content=form.elements.content.value.trim(),nickname=form.elements.nickname.value.trim().slice(0,24)||'匿名同学',button=form.querySelector('button');
  if(!content){notice('请填写评论内容。');return}
  button.disabled=true;button.textContent='发送中…';
  const {error}=await supabase.from('comments').insert({post_id:id,nickname,content,status:'pending'});
  button.disabled=false;button.textContent='发布评论';
  if(error){notice('评论提交失败，请稍后再试。');console.error('Comment submit failed:',error);return}
  form.reset();notice('评论已提交，审核通过后显示。');
 };
}
async function like(id){if(liked.has(id)){notice('每条内容每个浏览器只允许点赞一次。');return}const {error}=await supabase.rpc('increment_post_like',{post_id:id});if(error){notice('点赞失败，请稍后再试。');return}liked.add(id);localStorage.setItem('campus-liked',JSON.stringify([...liked]));const p=posts.find(x=>x.id===id);if(p)p.likes_count=(Number(p.likes_count)||0)+1;drawPosts()}
async function report(id){const reason=prompt('请简要说明举报原因（例如：隐私泄露、骚扰、违规内容）：');if(!reason||!reason.trim())return;const {error}=await supabase.from('reports').insert({post_id:id,reason:reason.trim().slice(0,300)});notice(error?'举报提交失败，请稍后再试。':'感谢反馈，举报已提交给管理员。')}
$('#sortOrder').onchange=()=>{sortOrder=$('#sortOrder').value;drawPosts()};
$('#openForm').onclick=()=>{$('#compose').hidden=false;$('#content').focus();notice('')};$('#cancel').onclick=()=>$('#compose').hidden=true;$('#refresh').onclick=load;$('#content').oninput=()=>$('#count').textContent=$('#content').value.length+'/1000 · 发布后需审核';
$('#compose').onsubmit=async e=>{e.preventDefault();const content=$('#content').value.trim();if(content.length<3){notice('请至少输入 3 个字。');return}$('#send').disabled=true;$('#send').textContent='提交中…';const {error}=await supabase.from('posts').insert({category:$('#category').value,nickname:$('#nickname').value.trim().slice(0,24)||'匿名同学',content,status:'pending'});$('#send').disabled=false;$('#send').textContent='提交投稿';if(error){notice('发布失败，请稍后再试。');console.error(error)}else{$('#content').value='';$('#count').textContent='0/1000 · 发布后需审核';$('#compose').hidden=true;notice('发布成功！为保护社区环境，动态通过审核后会显示。')}};
drawTabs();load();
</script>
<script>
(function(){
 const browserLang=(navigator.languages&&navigator.languages[0]||navigator.language||'zh-CN').toLowerCase();

 const lang=['zh-CN','en','ms'].includes(savedLang)?savedLang:(browserLang.startsWith('zh')?'zh-CN':(browserLang.startsWith('ms')?'ms':'en'));
 const languageSwitch=document.getElementById('languageSwitch');
 if(languageSwitch){languageSwitch.value=lang;languageSwitch.addEventListener('change',()=>{localStorage.setItem('campus-language',languageSwitch.value);location.reload()})}

 if(lang==='zh-CN') return;
 const map=maps[lang]||{};
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 function tr(s){let out=s;for(const k of keys){if(k)out=out.split(k).join(map[k]);}return out;}
 function skip(node){return !!node.parentElement?.closest('.content,.body,.author,.name,[data-user-content]');}
 function setTranslatedText(node){
  const original=node.nodeValue;
  if(skip(node)||!original.trim())return;
  const translated=tr(original);
  if(translated!==original)node.nodeValue=translated;
 }
 function walk(root){
  if(root.nodeType===Node.TEXT_NODE){setTranslatedText(root);return;}
  if(root.nodeType!==Node.ELEMENT_NODE)return;
  if(root.matches('script,style,textarea,.content,.body,.author,.name,[data-user-content]'))return;
  for(const attr of ['placeholder','aria-label','title']){
   if(root.hasAttribute(attr)){
    const original=root.getAttribute(attr), translated=tr(original);
    if(translated!==original)root.setAttribute(attr,translated);
   }
  }
  for(const child of root.childNodes)walk(child);
 }
 function apply(){walk(document.body);}
 apply();
 new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')m.addedNodes.forEach(walk);else if(m.type==='characterData')setTranslatedText(m.target);}}).observe(document.body,{subtree:true,childList:true,characterData:true});
})();
