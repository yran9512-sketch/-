lor:#8b3c63;font-size:13px;margin:12px 0}.compose,.post,.empty{background:#fff;border:1px solid #f3e4eb;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px #8d48680a}.compose h3{margin:0 0 16px}.compose label{display:block;font-size:13px;font-weight:650;margin:13px 0;color:#64485a}.compose input,.compose select,.compose textarea{display:block;width:100%;margin-top:7px;border:1px solid #ead7e1;border-radius:12px;padding:12px;background:#fffafd;outline-color:#d94f8b}.compose textarea{resize:vertical;min-height:105px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;font-size:12px;color:#9b8491}.post-head{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:14px;background:#fff0f6;display:grid;place-items:center;font-size:21px}.author{display:grid;gap:4px}.author strong{font-size:14px}.author small{font-size:11px;color:#a58d9b}.cat{margin-left:auto;background:#fff1f6;color:#c34a80;border-radius:99px;padding:6px 9px;font-size:11px;white-space:nowrap}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:15px;margin:16px 1px}.actions{display:flex;gap:18px;border-top:1px solid #f7edf2;padding-top:12px}.action{border:0;background:transparent;color:#967c8c;display:flex;align-items:center;gap:6px;padding:3px;font-size:12px}.action.liked{color:#d94f8b}.empty{text-align:center;padding:34px 14px;color:#a28a98}.empty strong{display:block;color:#795a6d;margin:8px}.footer{text-align:center;padding:24px 0;color:#ad93a1;font-size:12px;line-height:1.8}.footer strong{color:#d94f8b}[hidden]{display:none!important}@media(max-width:500px){.wrap{padding:12px 11px 30px}.hero{padding:22px 18px;border-radius:22px}.pill{font-size:10px}.compose,.post{padding:15px}.actions{justify-content:space-between;gap:6px}.hero h2{margin-top:22px}}

<body><div class="wrap">
<header class="hero"><div class="top"><div class="logo">✦</div><div class="brand"><h1>校园圈</h1><small>CAMPUS COMMUNITY · 分享真实校园生活</small></div><span class="pill">学生交流社区</span></div><h2>校园生活的每一面，<br><em>都值得分享。</em></h2><p>聊日常、问问题、分享兴趣，也可以只是记录今天。</p><button class="cta" id="openForm">＋ 发布一条动态</button></header>
<div class="section"><div><small id="schoolLabel">YOUR CAMPUS</small><h2>大家都在分享</h2></div><button class="refresh" id="refresh">↻ 刷新</button></div>
<div class="tools"><div class="tabs" id="tabs"></div><span class="status" id="status">正在连接数据库…</span></div>
<div class="notice" id="notice" hidden role="status"></div>
<form class="compose" id="compose" hidden><h3>✍️ 发布一条动态</h3><label>选择话题<select id="category"><option value="日常分享">日常分享</option><option value="校园生活">校园生活</option><option value="学习交流">学习交流</option><option value="求助互助">求助互助</option><option value="吐槽建议">吐槽建议</option><option value="兴趣交友">兴趣交友</option><option value="其他话题">其他话题</option></select></label><label>匿名昵称<input id="nickname" maxlength="24" value="匿名同学" placeholder="例如：晚风"></label><label>想分享的内容<textarea id="content" maxlength="1000" minlength="3" required placeholder="今天发生了什么？有什么经验、问题或想法想分享？请勿发布他人隐私、学号、联系方式或未经同意的照片。"></textarea></label><div class="row"><span id="count">0/1000 · 发布后需审核</span><div><button type="button" class="refresh" id="cancel">取消</button> <button class="submit" id="send" type="submit">提交投稿</button></div></div></form>
<div id="feed"></div><footer class="footer">✦ <strong>校园圈</strong> · 分享校园生活，连接每一个你<br>尊重不同观点，友善交流；请勿发布他人隐私、骚扰或违法内容。<br>新动态经基础审核后公开展示。</footer>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
// CONFIG: Publishable key is intended for browser use. Never put a service_role/secret key here.
const SUPABASE_URL = 'https://ttdzyotdtwpsuqideprq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_jPZubrHoG5XHihwAwnpfNg_3MOG_iAL';
const SCHOOL_NAME = '我的校园'; // Replace with your school's name.
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
document.querySelector('#schoolLabel').textContent = SCHOOL_NAME;
const categories=['全部','日常分享','校园生活','学习交流','求助互助','吐槽建议','兴趣交友','其他话题'];
const icons={'日常分享':'☀️','校园生活':'🏫','学习交流':'📚','求助互助':'🤝','吐槽建议':'💬','兴趣交友':'🎨','其他话题':'✦'};
let active='全部',posts=[],liked=new Set(JSON.parse(localStorage.getItem('campus-liked')||'[]'));
const $=s=>document.querySelector(s);
function notice(msg){$('#notice').textContent=msg;$('#notice').hidden=!msg}
function ago(d){const m=Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/60000));return m<1?'刚刚':m<60?m+'分钟前':m<1440?Math.floor(m/60)+'小时前':Math.floor(m/1440)+'天前'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawTabs(){$('#tabs').innerHTML=categories.map(c=>'<button class="tab '+(active===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawTabs();drawPosts()})}
function drawPosts(){const shown=posts.filter(p=>active==='全部'||p.category===active);$('#feed').innerHTML=shown.length?shown.map(p=>'<article class="post"><div class="post-head"><div class="avatar">'+(icons[p.category]||'💌')+'</div><div class="author"><strong>'+escapeHtml(p.nickname||'匿名同学')+'</strong><small>'+ago(p.created_at)+'</small></div><span class="cat">'+escapeHtml(p.category)+'</span></div><p class="content">'+escapeHtml(p.content)+'</p><div class="actions"><button class="action '+(liked.has(p.id)?'liked':'')+'" data-like="'+p.id+'">♡ '+(Number(p.likes_count)||0)+' 赞</button><button class="action" data-report="'+p.id+'">⚑ 举报</button></div></article>').join(''):'<div class="empty"><div style="font-size:30px">💌</div><strong>这里还没有内容</strong>来分享第一条动态吧。</div>';
$('#feed').querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>like(b.dataset.like));$('#feed').querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report))}
async function load(){$('#status').textContent='正在连接…';const {data,error}=await supabase.from('posts').select('id,category,nickname,content,created_at,likes_count').eq('status','approved').order('created_at',{ascending:false}).limit(100);if(error){$('#status').textContent='数据库连接失败';notice('暂时无法加载内容，请稍后刷新。');console.error(error)}else{$('#status').textContent='● 已连接';$('#status').className='status ok';posts=data||[];notice('')}drawPosts()}
async function like(id){if(liked.has(id)){notice('每条内容每个浏览器只允许点赞一次。');return}const {error}=await supabase.rpc('increment_post_like',{post_id:id});if(error){notice('点赞失败，请稍后再试。');return}liked.add(id);localStorage.setItem('campus-liked',JSON.stringify([...liked]));const p=posts.find(x=>x.id===id);if(p)p.likes_count=(Number(p.likes_count)||0)+1;drawPosts()}
async function report(id){const reason=prompt('请简要说明举报原因（例如：隐私泄露、骚扰、违规内容）：');if(!reason||!reason.trim())return;const {error}=await supabase.from('reports').insert({post_id:id,reason:reason.trim().slice(0,300)});notice(error?'举报提交失败，请稍后再试。':'感谢反馈，举报已提交给管理员。')}
$('#openForm').onclick=()=>{$('#compose').hidden=false;$('#content').focus();notice('')};$('#cancel').onclick=()=>$('#compose').hidden=true;$('#refresh').onclick=load;$('#content').oninput=()=>$('#count').textContent=$('#content').value.length+'/1000 · 发布后需审核';
$('#compose').onsubmit=async e=>{e.preventDefault();const content=$('#content').value.trim();if(content.length<3){notice('请至少输入 3 个字。');return}$('#send').disabled=true;$('#send').textContent='提交中…';const {error}=await supabase.from('posts').insert({category:$('#category').value,nickname:$('#nickname').value.trim().slice(0,24)||'匿名同学',content,status:'pending'});$('#send').disabled=false;$('#send').textContent='提交投稿';if(error){notice('发布失败，请稍后再试。');console.error(error)}else{$('#content').value='';$('#count').textContent='0/1000 · 发布后需审核';$('#compose').hidden=true;notice('发布成功！为保护社区环境，动态通过审核后会显示。')}};
drawTabs();load();
</script>

 const maps={"en":{"校园圈":"Campus Circle","分享真实校园生活":"Share real campus life","学生交流社区":"Student community","校园生活的每一面，":"Every side of campus life","都值得分享。":"is worth sharing.","聊日常、问问题、分享兴趣，也可以只是记录今天。":"Chat about daily life, ask questions, share interests, or simply record your day.","＋ 发布一条动态":"＋ Create a post","YOUR CAMPUS":"YOUR CAMPUS","大家都在分享":"Community feed","↻ 刷新":"↻ Refresh","正在连接数据库…":"Connecting to database…","全部":"All","日常分享":"Daily life","校园生活":"Campus life","学习交流":"Study","求助互助":"Help & support","吐槽建议":"Feedback","兴趣交友":"Interests & friends","其他话题":"Other","✍️ 发布一条动态":"✍️ Create a post","选择话题":"Choose a topic","匿名昵称":"Nickname (optional)","匿名同学":"Anonymous student","想分享的内容":"What would you like to share?","今天发生了什么？有什么经验、问题或想法想分享？请勿发布他人隐私、学号、联系方式或未经同意的照片。":"What happened today? Share an experience, question, or idea. Do not post private information, student IDs, contact details, or photos without consent.","取消":"Cancel","提交投稿":"Submit post","发布后需审核":"Pending review before publishing","发布成功！为保护社区环境，动态通过审核后会显示。":"Post submitted! It will appear after moderation to help keep the community safe.","发布失败，请稍后再试。":"Could not publish. Please try again later.","请至少输入 3 个字。":"Please enter at least 3 characters.","提交中…":"Submitting…","提交成功":"Submitted","数据库连接失败":"Database connection failed","暂时无法加载内容，请稍后刷新。":"Unable to load posts right now. Please refresh later.","正在连接…":"Connecting…","● 已连接":"● Connected","点赞失败，请稍后再试。":"Could not like this post. Please try again.","每条内容每个浏览器只允许点赞一次。":"Each post can be liked once per browser.","感谢反馈，举报已提交给管理员。":"Thank you. Your report has been sent to the administrator.","举报提交失败，请稍后再试。":"Could not submit report. Please try again later.","这里还没有内容":"Nothing here yet","来分享第一条动态吧。":"Be the first to share a post.","♡ ":"♡ "," 赞":" likes","⚑ 举报":"⚑ Report","请简要说明举报原因（例如：隐私泄露、骚扰、违规内容）：":"Briefly explain the reason for reporting (e.g. privacy leak, harassment, rule-breaking):","正在加载…":"Loading…","发布成功":"Published","投稿需审核":"Pending review"," ada kandungan","来分享第一条动态吧。":"Jadilah orang pertama yang berkongsi.","♡ ":"♡ "," 赞":" suka","⚑ 举报":"⚑ Lapor","请简要说明举报原因（例如：隐私泄露、骚扰、违规内容）：":"Terangkan sebab laporan (contohnya kebocoran privasi, gangguan atau kandungan melanggar peraturan):","正在加载…":"Sedang memuatkan…","发布成功":"Berjaya dihantar","投稿需审核":"Menunggu semakan","尊重不同观点，友善交流；请勿发布他人隐私、骚扰或违法内容。":"Hormati pandangan berbeza dan berkomunikasi dengan sopan. Jangan siarkan maklumat peribadi, gangguan atau kandungan haram.","新动态经基础审核后公开展示。":"Hantaran baharu dipaparkan selepas semakan.","分享校园生活，连接每一个你":"Kongsi kehidupan kampus, eratkan hubungan"}};
 if(lang==='zh-CN') return;
 const map=maps[lang]||{};
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 function tr(s){let out=s;for(const k of keys){if(k)out=out.split(k).join(map[k]);}return out;}
 function skip(node){return !!node.parentElement?.closest('.content,.body,.author,.name,[data-user-content]');}
 function walk(root){
  if(root.nodeType===Node.TEXT_NODE){if(!skip(root)&&root.nodeValue.trim())root.nodeValue=tr(root.nodeValue);return;}
  if(root.nodeType!==Node.ELEMENT_NODE)return;
  if(root.matches('script,style,textarea,.content,.body,.author,.name,[data-user-content]'))return;
  for(const attr of ['placeholder','aria-label','title'])if(root.hasAttribute(attr))root.setAttribute(attr,tr(root.getAttribute(attr)));
  for(const child of root.childNodes)walk(child);
 }
 function apply(){walk(document.body);}
 apply();
 new MutationObserver(ms=>{for(const m of ms){if(m.type==='childList')m.addedNodes.forEach(walk);else if(m.type==='characterData'&&!skip(m.target))m.target.nodeValue=tr(m.target.nodeValue);}}).observe(document.body,{subtree:true,childList:true,characterData:true});
})();
